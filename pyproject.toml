[project]
name = "gpushare"
version = "0.1.0"
requires-python = ">=3.11"

# Everyone gets these. No torch here — see extras.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13",
    "rich>=13",            # the stage terminal has to look clean (N-5)
]

[project.optional-dependencies]
# Jack: server hub + worker daemon. No torch on the server box.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",   # checkpoint upload
    "httpx>=0.27",
]
# Worker daemon needs GPU introspection but not the full trainer.
worker = [
    "httpx>=0.27",
    "nvidia-ml-py>=12.560",       # pynvml; skip on AMD boxes
]
# Ethan: NVIDIA training box.
cuda = [
    "torch>=2.5",
    "safetensors>=0.4.5",
    "numpy>=2.0",
    # Qwen2.5-0.5B is the real workload. transformers carries the architecture
    # and tokenizer; the training loop itself is ours.
    "transformers>=4.45",
    "peft>=0.14",          # optional LoRA training on smaller GPUs
    # torchft: fill in after T-2a. It ships nightly-only — if the verdict is
    # "works", pin the exact wheel here and add its index below.
]
# AMD box. Same code, different wheel.
rocm = [
    "torch>=2.5",
    "safetensors>=0.4.5",
    "numpy>=2.0",
    # Qwen2.5-0.5B is the real workload. transformers carries the architecture
    # and tokenizer; the training loop itself is ours.
    "transformers>=4.45",
    "peft>=0.14",
    # torch+rocm depends on this and it only exists on the ROCm index, so it
    # needs both a listing here and a [tool.uv.sources] entry below. Without
    # it the lock fails on EVERY machine, not just the AMD box.
    # NOTE the name: rocm7.0 ships "triton-rocm"; older indices called the same
    # thing "pytorch-triton-rocm". Changing the index URL means changing this.
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Ji: agents + dashboard. The LLM decision layer speaks to any OpenAI-compatible
# endpoint (Baseten today, OpenAI if its balance is topped up), so the OpenAI SDK
# is the client either way and the vendor is a base_url, not a dependency.
agent = [
    "openai>=1.40",
]

dev = [
    "ruff>=0.7",
    "pytest>=8",
    # The checkpoint/resume/migration tests build real tensors to verify the
    # bundle format, so they need numpy on a laptop too — without it they do
    # not fail, they fail to import, and `make test` reports collection errors
    # instead of a result. numpy is ~15 MB; torch is not here on purpose, and
    # the handful of tests that need it skip themselves.
    "numpy>=2.0",
]

[project.scripts]
gpushare-server  = "gpushare.server.main:main"
gpushare-worker  = "gpushare.worker.daemon:main"
gpushare-cli     = "gpushare.worker.cli:main"
gpushare-trainer = "gpushare.trainer.loop:main"
gpushare-mock    = "gpushare.agent.mock:main"
gpushare-ui      = "gpushare.dashboard.app:main"

# ── uv ────────────────────────────────────────────────────────────────────────
# cuda and rocm can never be installed together. uv will refuse to resolve a
# single lock that contains both, so declare the conflict explicitly.
[tool.uv]
conflicts = [
    [{ extra = "cuda" }, { extra = "rocm" }],
]

[[tool.uv.index]]
# RunPod hosts offer CUDA 12.8 / 13.x -- 12.4 is not available on most of them
# (checked against the live catalog: RTX 4090 reports 12.4 as unavailable).
# cu128 wheels run on 12.8 and the 13.x drivers; cu124 is a gamble we don't need.
# Verify on the actual pod with `make check` before trusting this.
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
# rocm6.2 caps torch at 2.5.1 while the CUDA side is on 2.11 -- too wide a gap
# for the cross-vendor migration experiment. rocm7.0 gives 2.10.0, near parity.
# UNVERIFIED against a real MI300X pod: ROCm wheels must match the host driver.
# Gate: launch an MI300X pod, run `make setup-rocm && make check`. If `available`
# is False, read the host's ROCm version and move this URL to match it.
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.0"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-rocm",  extra = "rocm" },
]
# torch+rocm pulls this in, and it only exists on the ROCm index. The index is
# explicit=true, so without this line uv looks on PyPI and the whole lock fails
# — on every machine, not just the AMD one.
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

# ── tooling ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpushare"]
