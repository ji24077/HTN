services:
  db:
    image: postgres:18-alpine
    container_name: dwp-db
    # Come back by itself after a reboot, so hosting needs one command, not two.
    restart: unless-stopped
    environment:
      POSTGRES_USER: dwp
      POSTGRES_PASSWORD: dwp
      POSTGRES_DB: dwp
    ports: ["5433:5432"]
    volumes: ["dwp-pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwp -d dwp"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dwp-pgdata:
